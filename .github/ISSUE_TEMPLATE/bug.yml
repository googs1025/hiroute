name: Bug report
description: Report a reproducible HiRoute product defect without sensitive data.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private conversations, diagnostic archives, or security-sensitive crash data. Report those through ASRC as described in SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use synthetic or redacted inputs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: HiRoute version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and architecture
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data check
      options:
        - label: I removed credentials, private conversation content, and other sensitive data.
          required: true
